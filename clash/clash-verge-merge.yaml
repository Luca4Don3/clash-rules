# Legacy：仅兼容机场已有 PROXY 组；推荐使用 clash-verge-script.js
profile:
  store-selected: true
rule-providers:
  reject:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Luca4Don3/clash-rules/master/rules/reject.list
    path: ./rules/reject.list
    interval: 86400
  direct:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Luca4Don3/clash-rules/master/rules/direct.list
    path: ./rules/direct.list
    interval: 86400
  sensitive:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Luca4Don3/clash-rules/master/rules/sensitive.list
    path: ./rules/sensitive.list
    interval: 86400
  direct-preferred:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Luca4Don3/clash-rules/master/rules/direct-preferred.list
    path: ./rules/direct-preferred.list
    interval: 86400
  proxy:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/Luca4Don3/clash-rules/master/rules/proxy.list
    path: ./rules/proxy.list
    interval: 86400
rules:
  - DOMAIN-SUFFIX,byteimg.com,DIRECT
  - DOMAIN-SUFFIX,ibytedtos.com,DIRECT
  - DOMAIN-SUFFIX,volccdn.com,DIRECT
  - DOMAIN-SUFFIX,volcdns.com,DIRECT
  - DOMAIN-SUFFIX,volceapi.com,DIRECT
  - DOMAIN-SUFFIX,volcengine-api.com,DIRECT
  - DOMAIN-SUFFIX,volcengine.com,DIRECT
  - DOMAIN-SUFFIX,volcengine.net,DIRECT
  - DOMAIN-SUFFIX,volcengineapi.com,DIRECT
  - DOMAIN-SUFFIX,volces.com,DIRECT
  - DOMAIN-SUFFIX,volcimagex.com,DIRECT
  - DOMAIN-SUFFIX,volcvideo.com,DIRECT
  - RULE-SET,reject,REJECT
  - GEOSITE,category-ads-all,REJECT
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR,240.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,ff00::/8,DIRECT,no-resolve
  - RULE-SET,sensitive,PROXY
  - GEOSITE,openai,PROXY
  - GEOSITE,anthropic,PROXY
  - RULE-SET,direct,DIRECT
  - GEOSITE,cn,DIRECT
  - RULE-SET,direct-preferred,DIRECT
  - RULE-SET,proxy,PROXY
  - GEOSITE,geolocation-!cn,PROXY
  - GEOSITE,gfw,PROXY
  - GEOSITE,google,PROXY
  - GEOSITE,youtube,PROXY
  - GEOSITE,telegram,PROXY
  - GEOSITE,facebook,PROXY
  - GEOSITE,twitter,PROXY
  - GEOSITE,instagram,PROXY
  - GEOSITE,whatsapp,PROXY
  - GEOSITE,discord,PROXY
  - GEOSITE,reddit,PROXY
  - GEOSITE,netflix,PROXY
  - GEOSITE,spotify,PROXY
  - GEOSITE,twitch,PROXY
  - GEOSITE,category-porn,PROXY
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,DIRECT
