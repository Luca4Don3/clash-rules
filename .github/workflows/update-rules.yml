name: Update rules

on:
  schedule:
    - cron: "0 2 * * *" # 每天 UTC 02:00(北京时间 10:00)
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download data sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .temp/upstream
          download() {
            local name="$1"
            local url="$2"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 600 --http1.1 \
              --output ".temp/upstream/${name}.part" "$url"
            mv ".temp/upstream/${name}.part" ".temp/upstream/${name}"
          }
          pids=()
          download geosite.dat https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat & pids+=("$!")
          download geoip.dat https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat & pids+=("$!")
          download anti-ad-domains.txt https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-domains.txt & pids+=("$!")
          download adguard-filter.txt https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt & pids+=("$!")
          download adrules.txt https://raw.githubusercontent.com/Cats-Team/AdRules/main/adblock.txt & pids+=("$!")
          download urlhaus.txt https://urlhaus.abuse.ch/downloads/text/ & pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"

      - name: Generate rules
        run: python3 tools/gen-shadowrocket.py --offline --dat-dir .temp/upstream

      - name: Test and validate
        run: |
          python3 -m unittest discover -s tests -v
          test -s clash/clash-verge-script.js
          git add clash/clash-verge-script.js clash/clash-verge-merge.yaml clash/rule-provider.yaml shadowrocket/shadowrocket.conf shadowrocket/geosite/*.list rules/ads-extra.list rules/malware.list rules/reject.list rules/direct.list rules/sensitive.list rules/direct-preferred.list rules/proxy.list rules/sources.json
          python3 tools/gen-shadowrocket.py --offline --dat-dir .temp/upstream
          git diff --exit-code

      - name: Guard against suspicious changes
        run: |
          if ! python3 tools/check-diff.py; then
            gh issue create \
              --title "规则更新异常:疑似上游异常" \
              --body "自动更新检测到可疑变化,已跳过推送,请人工审查上游数据源。$(git status --porcelain)"
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: auto-update rules from upstream"
            git push
          else
            echo "No changes, skip commit"
          fi
