name: Update rules

on:
  schedule:
    - cron: "0 2 * * *" # 每天 UTC 02:00(北京时间 10:00)
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download data sources
        run: |
          mkdir -p .temp/upstream
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 -o .temp/upstream/geosite.dat https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 -o .temp/upstream/geoip.dat https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 -o .temp/upstream/anti-ad-domains.txt https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-domains.txt
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 -o .temp/upstream/adguard-filter.txt https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 -o .temp/upstream/adrules.txt https://raw.githubusercontent.com/Cats-Team/AdRules/main/adblock.txt
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 -o .temp/upstream/urlhaus.txt https://urlhaus.abuse.ch/downloads/text/

      - name: Generate rules
        run: python3 tools/gen-shadowrocket.py --offline --dat-dir .temp/upstream

      - name: Test and validate
        run: |
          python3 -m unittest discover -s tests -v
          test -s clash/clash-verge-script.js
          git add clash/clash-verge-script.js clash/clash-verge-merge.yaml clash/rule-provider.yaml shadowrocket/shadowrocket.conf shadowrocket/geosite/*.list rules/ads-extra.list rules/malware.list rules/reject.list rules/direct.list rules/sensitive.list rules/direct-preferred.list rules/proxy.list rules/sources.json
          python3 tools/gen-shadowrocket.py --offline --dat-dir .temp/upstream
          git diff --exit-code

      - name: Guard against suspicious changes
        run: |
          if ! python3 tools/check-diff.py; then
            gh issue create \
              --title "规则更新异常:疑似上游异常" \
              --body "自动更新检测到可疑变化,已跳过推送,请人工审查上游数据源。$(git status --porcelain)"
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: auto-update rules from upstream"
            git push
          else
            echo "No changes, skip commit"
          fi
